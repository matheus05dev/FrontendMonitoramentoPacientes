<div class="page-container">
  <div class="page-header">
    <h1>Criar Usuário</h1>
    <p class="page-subtitle">Preencha os dados para cadastrar um novo usuário</p>
  </div>

  <div class="form-container">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label>Username</label>
          <input class="form-control" formControlName="username" placeholder="Digite o username" />
        </div>

        <div class="form-group">
          <label>Senha</label>
          <input type="password" class="form-control" formControlName="password" placeholder="Digite a senha" />
        </div>

        <div class="form-group">
          <label>Role</label>
          <select class="form-control" formControlName="role">
            <option value="" disabled>Selecione</option>
            <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" (click)="cancel()" class="btn btn-secondary">Cancelar</button>
        <button type="submit" [disabled]="form.invalid" class="btn btn-primary">Criar</button>
      </div>
    </form>
  </div>
</div>
